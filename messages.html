<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>The Guestbook</h1>
  <p>Here, you can send me messages, which I will review periodically. Suggestions about books to read. Critiques on my data project write-ups. Hate mail. Or nothing.
  Either way, it ends up in my email.</p>

  <form action="https://formspree.io/f/mwvgdnrp" method="POST">
    <label for="name">Name (optional):</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="message">Suggestion:</label><br>
    <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

    <button type="submit">Send</button>
  </form>
  
  <nav>
    <a href="index.html">Go Back</a>
  </nav>
</body>
</html>
